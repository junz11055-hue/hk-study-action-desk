name: Feature request
description: 提议一个具体的产品或工程改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述学生遇到的具体问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 数据与安全边界
      description: 是否涉及真实邮件、账户、日历或高影响判断？
    validations:
      required: true
