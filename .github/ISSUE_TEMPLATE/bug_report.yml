name: Bug report
description: 报告一个可以复现的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿提交真实邮件、个人信息、Cookie、Token 或 API Key。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 点击…\n3. 看到…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: "在线 Demo / macOS + Chrome / commit SHA"
